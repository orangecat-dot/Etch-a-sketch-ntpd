<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A webpage with a 16x16 grid of square divs.</title>
    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <button id ="numofsquare">Number of squares</button>
    <form style="display: none;">
        <label for="item">Please enter the number of the squares:</label>
        <input type="number" name="numberofsquare" id="numberofsquare">
        <button id="submit-btn">Submit</button>
    </form>
    <div id = "container"></div>
    

    <script src='main.js'></script>
    
</body>
</html>
